name: 'mender_artifact'

on:
  workflow_dispatch:
  push:
    branches:
      - mender-deploy

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set_vars.outputs.artifact_name }}
      mender_version: ${{ steps.set_vars.outputs.mender_version }}
    steps:
      - id: set_vars
        run: |
          echo "artifact_name=test-artifact-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "mender_version=4.0.5" >> $GITHUB_OUTPUT

  install_mender_artifact:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Install mender-artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact
          mender-artifact --version

  generate_artifact:
    runs-on: ubuntu-latest
    needs: [setup, install_mender_artifact]
    steps:
      - name: Download single-file-artifact-gen script
        run: |
          curl -O https://raw.githubusercontent.com/mendersoftware/mender/5.0.2/support/modules-artifact-gen/single-file-artifact-gen
          chmod +x single-file-artifact-gen

      - name: Install mender-artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact

      - name: Create test payload file
        run: |
          echo "This is a test payload for Mender artifact generation" > test-payload.txt
          echo "Generated at: $(date)" >> test-payload.txt
          echo "Workflow run: ${{ github.run_number }}" >> test-payload.txt

      - name: Generate Mender artifact
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: |
          ./single-file-artifact-gen \
            --device-type test-device \
            --device-type generic-x86_64 \
            -o ${ARTIFACT_NAME}.mender \
            -n ${ARTIFACT_NAME} \
            --software-name test-payload \
            --software-version 1.0.0 \
            --dest-dir /tmp/test \
            test-payload.txt

      - name: Verify artifact was created
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: |
          ls -lh ${ARTIFACT_NAME}.mender
          mender-artifact read ${ARTIFACT_NAME}.mender

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}
          path: ${{ needs.setup.outputs.artifact_name }}.mender

      - name: Upload artifact to Mender
        uses: mendersoftware/mender-gh-action-upload-artifact@v1.0.0
        with:
          mender_pat: ${{ secrets.MENDER_PAT }}
          mender_artifact: ${{ needs.setup.outputs.artifact_name }}.mender
          mender_uri: hosted.mender.io

  validate:
    runs-on: ubuntu-latest
    needs: [setup, generate_artifact]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}

      - name: Install mender-artifact for validation
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact

      - name: Validate downloaded artifact
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: |
          echo "Validating artifact: ${ARTIFACT_NAME}.mender"
          mender-artifact validate ${ARTIFACT_NAME}.mender
          echo "Artifact validation successful!"
