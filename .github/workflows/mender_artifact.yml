name: 'mender_artifact'

on:
  workflow_dispatch:
  push:
    branches:
      - mender-deploy

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set_vars.outputs.artifact_name }}
      mender_version: ${{ steps.set_vars.outputs.mender_version }}
    steps:
      - id: set_vars
        run: |
          echo "artifact_name=test-artifact-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "mender_version=4.0.5" >> $GITHUB_OUTPUT

  install_mender_artifact:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Install mender-artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact

  generate_artifact:
    runs-on: ubuntu-latest
    needs: [setup, install_mender_artifact]
    steps:
      - name: Download single-file-artifact-gen script
        run: |
          curl -O https://raw.githubusercontent.com/mendersoftware/mender/5.0.2/support/modules-artifact-gen/single-file-artifact-gen
          chmod +x single-file-artifact-gen

      - name: Install mender-artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact

      - name: Create test payload file
        run: |
          echo "This is a test payload for Mender artifact generation" > test-payload.txt
          echo "Generated at: $(date)" >> test-payload.txt
          echo "Workflow run: ${{ github.run_number }}" >> test-payload.txt

      - name: Generate Mender artifact
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: |
          ./single-file-artifact-gen \
            --device-type test-device \
            --device-type generic-x86_64 \
            -o ${ARTIFACT_NAME}.mender \
            -n ${ARTIFACT_NAME} \
            --software-name test-payload \
            --software-version 1.0.0 \
            --dest-dir /tmp/test \
            test-payload.txt

      - name: Verify artifact was created
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: mender-artifact read ${ARTIFACT_NAME}.mender

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}
          path: ${{ needs.setup.outputs.artifact_name }}.mender

      - name: Upload artifact to Mender
        uses: mendersoftware/mender-gh-action-upload-artifact@v1.0.0
        with:
          mender_pat: ${{ secrets.MENDER_PAT }}
          mender_artifact: ${{ needs.setup.outputs.artifact_name }}.mender
          mender_uri: hosted.mender.io

  validate:
    runs-on: ubuntu-latest
    needs: [setup, generate_artifact]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}

      - name: Install mender-artifact for validation
        run: |
          sudo apt-get update
          sudo apt-get install -y mender-artifact

      - name: Validate downloaded artifact
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
        run: mender-artifact validate ${ARTIFACT_NAME}.mender

  deploy_by_device_list:
    runs-on: ubuntu-latest
    needs: [setup, validate]
    steps:
      - name: Get device IDs
        id: get_devices
        env:
          MENDER_PAT: ${{ secrets.MENDER_PAT }}
        run: |
          DEVICE_IDS=$(curl -s -H "Authorization: Bearer ${MENDER_PAT}" \
            "https://hosted.mender.io/api/management/v2/devauth/devices?status=accepted" \
            | jq -r '[.[].id] | join(",")')
          echo "device_ids=${DEVICE_IDS}" >> $GITHUB_OUTPUT

      - name: Create deployment by device list
        if: steps.get_devices.outputs.device_ids != ''
        uses: pkgl/mender-gh-action-create-deployment@feat/deployment-to-attributes
        with:
          mender_pat: ${{ secrets.MENDER_PAT }}
          mender_deployment_name: deploy-by-list-${{ github.run_number }}
          mender_release_name: ${{ needs.setup.outputs.artifact_name }}
          mender_devices_list: ${{ steps.get_devices.outputs.device_ids }}
          mender_uri: hosted.mender.io

  deploy_by_device_group:
    runs-on: ubuntu-latest
    needs: [setup, validate]
    steps:
      - name: Get device group
        id: get_group
        env:
          MENDER_PAT: ${{ secrets.MENDER_PAT }}
        run: |
          GROUP_NAME=$(curl -s -H "Authorization: Bearer ${MENDER_PAT}" \
            "https://hosted.mender.io/api/management/v1/inventory/groups" \
            | jq -r '.[0]')
          echo "group_name=${GROUP_NAME}" >> $GITHUB_OUTPUT

      - name: Create deployment by device group
        if: steps.get_group.outputs.group_name != 'null' && steps.get_group.outputs.group_name != ''
        uses: pkgl/mender-gh-action-create-deployment@feat/deployment-to-attributes
        with:
          mender_pat: ${{ secrets.MENDER_PAT }}
          mender_deployment_name: deploy-by-group-${{ github.run_number }}
          mender_release_name: ${{ needs.setup.outputs.artifact_name }}
          mender_devices_group: ${{ steps.get_group.outputs.group_name }}
          mender_uri: hosted.mender.io

  deploy_by_device_attributes:
    runs-on: ubuntu-latest
    needs: [setup, validate]
    steps:
      - name: Create deployment by device attributes
        uses: pkgl/mender-gh-action-create-deployment@feat/deployment-to-attributes
        with:
          mender_pat: ${{ secrets.MENDER_PAT }}
          mender_deployment_name: deploy-by-attributes-${{ github.run_number }}
          mender_release_name: ${{ needs.setup.outputs.artifact_name }}
          mender_device_attributes: device_type=test-device
          mender_uri: hosted.mender.io

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, deploy_by_device_list, deploy_by_device_group, deploy_by_device_attributes]
    if: always()
    steps:
      - name: Get artifact ID
        id: get_artifact_id
        env:
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}
          MENDER_PAT: ${{ secrets.MENDER_PAT }}
        run: |
          ARTIFACT_ID=$(curl -s -H "Authorization: Bearer ${MENDER_PAT}" \
            "https://hosted.mender.io/api/management/v1/deployments/artifacts" \
            | jq -r ".[] | select(.name == \"${ARTIFACT_NAME}\") | .id")
          echo "artifact_id=${ARTIFACT_ID}" >> $GITHUB_OUTPUT

      - name: Delete artifact from Mender
        if: steps.get_artifact_id.outputs.artifact_id != ''
        env:
          ARTIFACT_ID: ${{ steps.get_artifact_id.outputs.artifact_id }}
          MENDER_PAT: ${{ secrets.MENDER_PAT }}
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${MENDER_PAT}" \
            "https://hosted.mender.io/api/management/v1/deployments/artifacts/${ARTIFACT_ID}"
